<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCR — My Submissions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo">KCR</div>
        <div>
          <h2>KCR Manager</h2>
          <small>Submission Portal</small>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
      </nav>

      <div class="sidebar-footer">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info">
          <div class="name" id="userName">Loading...</div>
          <div class="role" id="userRole">Loading...</div>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="top-bar">
        <div style="display:flex;align-items:center;gap:1rem;">
          <button class="hamburger" type="button" aria-label="Toggle navigation">&#9776;</button>
          <span class="page-title">My Submissions</span>
        </div>

        <div class="top-bar-actions">
          <a href="submit.html" class="btn btn-primary btn-sm">+ New Submission</a>
          <button type="button" data-action="signout" class="btn btn-secondary btn-sm">Sign Out</button>
        </div>
      </header>

      <div class="page-content">

        <div class="filters-bar">
          <div class="search-input">
            <span class="search-icon">&#128269;</span>
            <input id="submissions-search" type="text" placeholder="Search by title, genre, or ID...">
          </div>

          <select id="filter-status" class="filter-select">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="in_review">In Review</option>
            <option value="accepted">Accepted</option>
            <option value="rejected">Rejected</option>
          </select>

          <select id="filter-genre" class="filter-select">
            <option value="">All Genres</option>
            <option>Poetry</option>
            <option>Short Fiction</option>
            <option>Creative Non-Fiction</option>
            <option>Visual Art</option>
            <option>Photography</option>
          </select>

          <select id="filter-sort" class="filter-select">
            <option value="newest">Sort: Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="title">Title A-Z</option>
          </select>
        </div>

        <div class="card">
          <div class="card-body" style="padding:0;">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Genre</th>
                    <th>Word Count</th>
                    <th>Submitted</th>
                    <th>Status</th>
                    <th>Rating</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody id="my-submissions-tbody">
                  <tr>
                    <td colspan="8" style="text-align:center;padding:2rem;" class="text-muted">
                      Loading submissions...
                    </td>
                  </tr>
                </tbody>

              </table>
            </div>
          </div>

          <div class="card-footer" style="display:flex;justify-content:space-between;align-items:center;">
            <span id="submissions-count" class="text-small text-muted">Loading submissions...</span>
            <div class="btn-group">
              <button class="btn btn-secondary btn-sm" disabled>Previous</button>
              <button class="btn btn-secondary btn-sm" disabled>Next</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/submissions.js"></script>
</body>
</html>
