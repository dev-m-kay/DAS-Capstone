<header class="top-bar">
  <span class="page-title">New Submission</span>
</header>

<div class="page-content">

  <div class="card" style="max-width:800px;">
    <div class="card-header">
      <h3>Submit Your Work</h3>
    </div>

    <div class="card-body">

      <form id="submissionForm">

        <!-- Title -->
        <div class="form-group">
          <label>Title</label>
          <input id="title" type="text" class="form-control" required>
        </div>

        <!-- Genre &  word Count -->
        <div class="form-row">

          <div class="form-group">
            <label>Genre</label>
            <select id="genre" class="form-control" required>
              <option value="">Select genre</option>
              <option>Poetry</option>
              <option>Short Fiction</option>
              <option>Creative Non-Fiction</option>
              <option>Visual Art</option>
              <option>Photography</option>
            </select>
          </div>

          <div class="form-group">
            <label>Word Count</label>
            <input id="wordCount" type="number" class="form-control">
          </div>

        </div>

        <!-- Bio -->
        <div class="form-group">
          <label>Bio</label>
          <textarea id="bio" class="form-control" required></textarea>
        </div>

        <!-- Notes -->
        <div class="form-group">
          <label>Notes</label>
          <textarea id="notes" class="form-control"></textarea>
        </div>

        <!-- Files -->
        <div class="form-group">
          <label>Upload Files</label>

          <div id="uploadZone" class="file-upload-zone">
            Click to upload
          </div>

          <!-- IMPORTANT ID CHANGE -->
          <input id="files" type="file" multiple style="display:none;">

          <div id="fileList"></div>
        </div>

      </form>

    </div>

    <div class="card-footer">
      <button type="submit" form="submissionForm" class="btn btn-primary">
        Submit
      </button>
    </div>

  </div>

</div>
