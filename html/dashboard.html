<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCR — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo">KCR</div>
        <div>
          <h2>KCR Manager</h2>
          <small>Submission Portal</small>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!--Links will be filled in here by apps.js-->
      </nav>
      <div class="sidebar-footer">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info">
          <div class="name" id="userName">Loading...</div>
          <div class="role" id="userRole">Loading...</div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-content">
      <header class="top-bar">
        <div style="display:flex;align-items:center;gap:1rem;">
          <button class="hamburger" type="button" aria-label="Toggle navigation">&#9776;</button>
          <span class="page-title">Dashboard</span>
        </div>
        <div class="top-bar-actions">
          <div class="notification-bell">
            <button class="btn-icon" title="Notifications">&#128276;</button>
            <span class="badge-count">3</span>
          </div>
          <button type="button" data-action="signout" class="btn btn-secondary btn-sm">Sign Out</button>
        </div>
      </header>

      <div class="page-content">
        <!-- Stats Overview -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon blue">&#128196;</div>
            <div>
              <div class="stat-value" id="stat-total">&mdash;</div>
              <div class="stat-label">Total Submissions</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon yellow">&#9203;</div>
            <div>
              <div class="stat-value" id="stat-pending">&mdash;</div>
              <div class="stat-label">Pending Review</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">&#10004;</div>
            <div>
              <div class="stat-value" id="stat-accepted">&mdash;</div>
              <div class="stat-label">Accepted</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon red">&#10006;</div>
            <div>
              <div class="stat-value" id="stat-rejected">&mdash;</div>
              <div class="stat-label">Rejected</div>
            </div>
          </div>
        </div>

        <!-- Recent Submissions Table -->
        <div class="card">
          <div class="card-header">
            <h3>Recent Submissions</h3>
            <a href="submit.html" class="btn btn-primary btn-sm">+ New Submission</a>
          </div>
          <div class="card-body" style="padding:0;">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Submission ID</th>
                    <th>Title</th>
                    <th>Genre</th>
                    <th>Submitted</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="dashboard-tbody">
                  <tr>
                    <td colspan="6" style="text-align:center;padding:2rem;" class="text-muted">
                      Loading submissions...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/submissions.js"></script>
</body>
</html>
