<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCR — Submission Detail</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
<div class="app-layout">

  <aside class="sidebar" id="sidebar">
    <nav id="sidebarNav"></nav>
  </aside>

  <div class="main-content">

```
<header class="top-bar">
  <span class="page-title" id="detail-page-title">
    Loading...
  </span>
</header>

<div class="page-content">

  <div class="doc-viewer">

    <!-- LEFT: FILE PREVIEW -->
    <div class="doc-preview">

      <div class="doc-preview-header">
        <div>
          <strong id="detail-title">Loading...</strong>
          <span id="preview-file-name"></span>
        </div>

        <button id="download-file-btn" class="btn btn-secondary btn-sm">
          Download
        </button>
      </div>

      <div class="doc-preview-body" id="document-preview-body">
        Loading preview...
      </div>

    </div>

    <!-- RIGHT: INFO -->
    <div class="doc-sidebar">

      <div class="card">
        <div class="card-header">
          <h4>Submission Details</h4>
          <span id="detail-status" class="badge">Loading...</span>
        </div>

        <div class="card-body">

          <p><strong>ID:</strong> <span id="detail-id"></span></p>
          <p><strong>Genre:</strong> <span id="detail-genre"></span></p>
          <p><strong>Word Count:</strong> <span id="detail-word-count"></span></p>
          <p><strong>Date:</strong> <span id="detail-date"></span></p>

          <div>
            <strong>Files:</strong>
            <div id="detail-files"></div>
          </div>

        </div>
      </div>

      <!-- DECISION -->
      <div class="card" id="decision-card">
        <div class="card-header"><h4>Decision</h4></div>
        <div class="card-body">
          <button onclick="setDecision('accepted')" class="btn btn-success">Accept</button>
          <button onclick="setDecision('rejected')" class="btn btn-danger">Reject</button>
          <button onclick="setDecision('pending')" class="btn btn-warning">Pending</button>
        </div>
      </div>

    </div>

  </div>

</div>
```

</div>

</body>
</html>
