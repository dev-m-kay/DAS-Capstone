<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCR — Submission Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .rating { display: flex; gap: .25rem; font-size: 1.5rem; cursor: pointer; }
    .rating .star { color: var(--border); transition: color var(--transition); }
    .rating .star.filled { color: var(--accent, #f59e0b); }

    .message-list { display: flex; flex-direction: column; gap: 1rem; max-height: 360px; overflow-y: auto; padding: .5rem 0; }
    .message-item { display: flex; gap: .75rem; }
    .message-item .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: .7rem; flex-shrink: 0; background: var(--primary); }
    .message-item .msg-content { flex: 1; min-width: 0; }
    .message-item .msg-header { display: flex; gap: .5rem; align-items: baseline; }
    .message-item .msg-author { font-weight: 600; font-size: .85rem; }
    .message-item .msg-time { font-size: .7rem; color: var(--text-light); }
    .message-item .msg-body { font-size: .875rem; line-height: 1.5; word-wrap: break-word; }
    .message-compose { display: flex; gap: .5rem; margin-top: .75rem; }
    .message-compose input { flex: 1; padding: .55rem .8rem; border: 1px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: .875rem; }
    .message-compose input:focus { outline: none; border-color: var(--primary); }

    .doc-preview-image { display: flex; align-items: center; justify-content: center; min-height: 100%; background: var(--surface-alt, #f8fafc); padding: 1rem; }
    .doc-preview-image img { max-width: 100%; max-height: 70vh; object-fit: contain; box-shadow: var(--shadow); }
    .doc-preview-docx { padding: 1.5rem; max-height: 70vh; overflow-y: auto; background: #fff; line-height: 1.6; }
    .doc-preview-docx h1, .doc-preview-docx h2, .doc-preview-docx h3 { margin: 1.25rem 0 .5rem; }
    .doc-preview-docx p { margin: .5rem 0; }
    .doc-preview-docx table { border-collapse: collapse; margin: .5rem 0; }
    .doc-preview-docx td, .doc-preview-docx th { border: 1px solid var(--border); padding: .35rem .5rem; }
    .doc-preview-docx img { max-width: 100%; }

    .discussion-preview { cursor: pointer; transition: background var(--transition); }
    .discussion-preview:hover { background: var(--primary-light); }
    .discussion-preview .discussion-cta { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding-top: .5rem; margin-top: .5rem; border-top: 1px solid var(--border); font-size: .85rem; color: var(--primary); font-weight: 500; }
    .discussion-preview .discussion-cta .arrow { font-size: 1rem; }

    .reviews-summary { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .75rem; padding-bottom: .75rem; border-bottom: 1px solid var(--border); }
    .reviews-summary .avg { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .reviews-summary .avg-stars { color: var(--accent, #f59e0b); letter-spacing: 1px; }
    .reviews-summary .avg-meta { color: var(--text-muted); font-size: .8rem; }

    .review-entry { padding: .75rem 0; border-bottom: 1px solid var(--border); }
    .review-entry:last-child { border-bottom: none; }
    .review-entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
    .review-entry-name { font-weight: 600; font-size: .9rem; }
    .review-entry-name .role-badge { display: inline-block; padding: 0 .35rem; margin-left: .25rem; border-radius: .25rem; background: var(--surface-alt, #f1f5f9); color: var(--text-muted); font-size: .65rem; text-transform: uppercase; }
    .review-entry-stars { color: var(--accent, #f59e0b); letter-spacing: 1px; font-size: .9rem; }
    .review-entry-time { font-size: .7rem; color: var(--text-light); }
    .review-entry-comment { font-size: .85rem; line-height: 1.5; margin-top: .35rem; white-space: pre-wrap; word-wrap: break-word; }
    .review-entry-comment.muted { color: var(--text-muted); font-style: italic; }
  </style>
</head>

<body>
<div class="app-layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">KCR</div>
      <div>
        <h2>KCR Manager</h2>
        <small>Submission Portal</small>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="avatar" id="userAvatar">U</div>
      <div class="user-info">
        <div class="name" id="userName">Loading...</div>
        <div class="role" id="userRole">Loading...</div>
      </div>
    </div>
  </aside>

  <div class="main-content">

    <header class="top-bar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="hamburger" type="button" aria-label="Toggle navigation">&#9776;</button>
        <span class="page-title" id="detail-page-title">Loading...</span>
      </div>
      <div class="top-bar-actions">
        <button type="button" data-action="signout" class="btn btn-secondary btn-sm">Sign Out</button>
      </div>
    </header>

    <div class="page-content">

      <div class="doc-viewer" style="display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:1.5rem;align-items:start;">

        <!-- LEFT: FILE PREVIEW -->
        <div class="doc-preview card">
          <div class="doc-preview-header card-header" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">
            <div style="min-width:0;">
              <strong id="detail-title">Loading...</strong>
              <div class="text-small text-muted" id="preview-file-name"></div>
            </div>
            <button id="download-file-btn" class="btn btn-secondary btn-sm">Download</button>
          </div>
          <div class="doc-preview-body card-body" id="document-preview-body" style="min-height:400px;">
            Loading preview...
          </div>
        </div>

        <!-- RIGHT: INFO + REVIEW + DISCUSSION -->
        <div class="doc-sidebar" style="display:flex;flex-direction:column;gap:1rem;">

          <div class="card">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
              <h4>Submission Details</h4>
              <span id="detail-status" class="badge">Loading...</span>
            </div>
            <div class="card-body">
              <p><strong>ID:</strong> <span id="detail-id"></span></p>
              <p><strong>Genre:</strong> <span id="detail-genre"></span></p>
              <p><strong>Word Count:</strong> <span id="detail-word-count"></span></p>
              <p><strong>Date:</strong> <span id="detail-date"></span></p>
              <div>
                <strong>Files:</strong>
                <div id="detail-files"></div>
              </div>
            </div>
          </div>

          <!-- DECISION (admin/editor only; toggled by submissions.js) -->
          <div class="card" id="decision-card">
            <div class="card-header"><h4>Decision</h4></div>
            <div class="card-body" style="display:flex;flex-wrap:wrap;gap:.5rem;">
              <button type="button" data-decision="accepted" class="btn btn-success btn-sm">Accept</button>
              <button type="button" data-decision="rejected" class="btn btn-danger btn-sm">Reject</button>
              <button type="button" data-decision="pending" class="btn btn-warning btn-sm">Pending</button>
            </div>
          </div>

          <!-- RATING (reviewer/editor only; toggled by reviews.js) -->
          <div class="card" id="rating-card">
            <div class="card-header"><h4>Your Review</h4></div>
            <div class="card-body">
              <div class="rating" id="ratingStars">
                <span class="star" data-value="1">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="5">&#9733;</span>
              </div>
              <div class="form-group" style="margin-top:.75rem;">
                <label class="form-label" for="review-comment">Comment</label>
                <textarea id="review-comment" class="form-control" rows="4" placeholder="Optional feedback..."></textarea>
              </div>
              <button id="submit-review-btn" class="btn btn-primary btn-sm" style="width:100%;justify-content:center;">Submit Review</button>
            </div>
          </div>

          <!-- REVIEWER FEEDBACK (admin/editor only; populated by reviews.js) -->
          <div class="card" id="reviews-card" style="display:none;">
            <div class="card-header"><h4>Reviewer Feedback</h4></div>
            <div class="card-body">
              <div id="reviews-summary" class="reviews-summary" style="display:none;"></div>
              <div id="reviews-list">
                <p class="text-muted" style="font-size:.85rem;">Loading reviews…</p>
              </div>
            </div>
          </div>

          <!-- DISCUSSION (preview only — clicking opens the full Messages page) -->
          <div class="card discussion-preview" id="discussion-card" role="link" tabindex="0"
               aria-label="Open discussion in Messages">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
              <h4>Discussion</h4>
              <span class="text-small text-muted" id="discussion-count"></span>
            </div>
            <div class="card-body">
              <div class="message-list" id="message-list"></div>
              <div class="discussion-cta">
                <span>Open in Messages</span>
                <span class="arrow" aria-hidden="true">&rarr;</span>
              </div>
            </div>
          </div>

        </div>

      </div>

    </div>

  </div>
</div>

<script src="../js/app.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/lib/mammoth.browser.min.js"></script>
<script src="../js/submissions.js"></script>
<script src="../js/reviews.js"></script>
<script src="../js/messages.js"></script>

</body>
</html>
